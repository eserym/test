<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grenn Pwomennen</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap');

    :root {
      --ink: #060505;
      --bone: #f0ece4;
      --choublak: #c4402f;
      --grey: #4a4a4a;
      --light-grey: #8a8a8a;
      --warm: #d9a066;
      --sous: #b9c4d6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--ink);
      color: var(--bone);
      font-family: 'EB Garamond', serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- material grain: real 16mm scan when present, procedural until ---------- */
    #grainVid {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      object-fit: cover; pointer-events: none; z-index: 94;
      mix-blend-mode: screen; opacity: 0.12; display: none;
    }
    .grain {
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      pointer-events: none; z-index: 94; opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.5s steps(6) infinite;
    }
    @keyframes grain {
      0%,100% { transform: translate(0,0); } 20% { transform: translate(-4%,-8%); }
      40% { transform: translate(4%,-4%); } 60% { transform: translate(-4%,6%); } 80% { transform: translate(6%,2%); }
    }

    /* =================== PÒTAY — the portal =================== */
    .portal {
      position: fixed; inset: 0; z-index: 80;
      background: var(--ink);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 2rem;
      transition: opacity 2s ease, visibility 2s ease;
    }
    .portal.gone { opacity: 0; visibility: hidden; pointer-events: none; }

    .knock-form {
      display: flex; align-items: center; gap: 1rem;
      border-bottom: 1px solid rgba(240,236,228,0.25);
      padding-bottom: 0.6rem; transition: border-color 0.5s ease;
    }
    .knock-form:focus-within { border-color: rgba(240,236,228,0.6); }
    .knock-input {
      background: none; border: none; outline: none;
      color: var(--bone); font-family: 'EB Garamond', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem); text-align: center;
      width: min(60vw, 420px); caret-color: var(--choublak);
    }
    .mic {
      background: none; border: 1px solid rgba(240,236,228,0.2);
      border-radius: 50%; width: 44px; height: 44px; cursor: pointer;
      color: var(--light-grey); display: flex; align-items: center; justify-content: center;
      transition: border-color 0.3s ease, color 0.3s ease; flex-shrink: 0;
    }
    .mic:hover { border-color: var(--choublak); color: var(--bone); }
    .mic.listening { border-color: var(--choublak); color: var(--choublak); animation: micPulse 1.2s ease-in-out infinite; }
    @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,64,47,0.35); } 50% { box-shadow: 0 0 0 10px rgba(196,64,47,0); } }
    .mic svg { width: 18px; height: 18px; }

    .whisper {
      margin-top: 2.4rem; text-align: center; font-style: italic;
      font-size: 0.95rem; color: rgba(240,236,228,0.35); line-height: 2;
      opacity: 0; transition: opacity 2s ease; min-height: 3em;
    }
    .whisper.visible { opacity: 1; }

    .grann-zone { display: none; flex-direction: column; align-items: center; max-width: 640px; text-align: center; }
    .grann-zone.visible { display: flex; }
    .grann-btn { background: none; border: none; cursor: pointer; margin-bottom: 1.8rem; }
    .grann-presence {
      width: clamp(110px, 16vw, 160px); height: clamp(140px, 20vw, 200px);
      border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
      background:
        radial-gradient(ellipse at 50% 32%, rgba(217,160,102,0.5), rgba(217,160,102,0.12) 55%, transparent 75%),
        radial-gradient(ellipse at 50% 65%, rgba(196,64,47,0.18), transparent 70%);
      filter: blur(1px); border: 1px solid rgba(217,160,102,0.25);
      animation: presence 5s ease-in-out infinite; margin: 0 auto;
      background-size: cover; background-position: center;
    }
    .grann-presence.photo {
      filter: grayscale(0.4) sepia(0.25) contrast(1.05);
      border-radius: 2px; border: 1px solid rgba(217,160,102,0.4);
    }
    @keyframes presence { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    .grann-name {
      display: block; margin-top: 0.8rem;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem;
      letter-spacing: 0.35em; text-transform: uppercase; color: var(--warm);
    }
    .counsel-line {
      opacity: 0; transform: translateY(12px);
      transition: opacity 1.2s ease, transform 1.2s ease; margin-bottom: 1rem;
    }
    .counsel-line.visible { opacity: 1; transform: translateY(0); }
    .counsel-line.kreyol { font-size: clamp(1.1rem, 2.4vw, 1.45rem); font-style: italic; line-height: 1.6; }
    .counsel-line.echo { font-family: 'Space Grotesk', sans-serif; font-size: 0.75rem; color: var(--light-grey); line-height: 1.8; }

    .respe-flash {
      position: fixed; inset: 0; z-index: 85;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, rgba(38,16,12,0.9), var(--ink) 75%);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 1.2s ease, visibility 1.2s ease;
    }
    .respe-flash.visible { opacity: 1; visibility: visible; }
    .respe-word {
      font-size: clamp(3.5rem, 14vw, 11rem); letter-spacing: 0.04em;
      transform: scale(0.96); opacity: 0;
      transition: transform 2.2s cubic-bezier(0.16,1,0.3,1), opacity 2.2s ease;
    }
    .respe-flash.visible .respe-word { transform: scale(1); opacity: 1; }

    /* =================== SYÈL LA — the sky =================== */
    #sky {
      position: fixed; inset: 0; display: block; cursor: grab;
      opacity: 0; transition: opacity 2.5s ease;
    }
    #sky.on { opacity: 1; }
    #sky.dragging { cursor: grabbing; }

    #label {
      position: fixed; z-index: 60; pointer-events: none;
      font-style: italic; font-size: 1rem; color: var(--bone);
      text-shadow: 0 0 14px rgba(0,0,0,0.95);
      opacity: 0; transition: opacity 0.25s ease;
      transform: translate(-50%, -200%); white-space: nowrap; text-align: center;
    }
    #label .kind {
      display: block; font-family: 'Space Grotesk', sans-serif; font-style: normal;
      font-size: 0.55rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--warm); margin-top: 0.3rem;
    }
    #label.visible { opacity: 1; }

    .sky-hint {
      position: fixed; bottom: 2.2rem; left: 0; right: 0; z-index: 60;
      text-align: center; pointer-events: none; font-style: italic;
      font-size: 0.85rem; color: rgba(240,236,228,0.3);
      opacity: 0; transition: opacity 2s ease;
    }
    .sky-hint.visible { opacity: 1; }
    .sky-hint.gone { opacity: 0; }

    .mute {
      position: fixed; bottom: 1.6rem; right: 1.8rem; z-index: 92;
      background: none; border: none; cursor: pointer;
      color: var(--grey); font-family: 'Space Grotesk', sans-serif;
      font-size: 0.6rem; letter-spacing: 0.3em; text-transform: uppercase;
      padding: 0.5rem; transition: color 0.3s ease; display: none;
    }
    .mute:hover { color: var(--bone); }
    .mute.on { display: block; }

    /* =================== VEIL (threshold tear) =================== */
    #veil {
      position: fixed; inset: 0; z-index: 88;
      pointer-events: none; display: none;
    }

    /* =================== CHANM — the chamber =================== */
    .chanm {
      position: fixed; inset: 0; z-index: 86;
      background: rgba(4,3,3,0.88);
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.9s ease, visibility 0.9s ease;
      cursor: pointer;
    }
    .chanm.visible { opacity: 1; visibility: visible; pointer-events: auto; }

    .chanm-stage { position: absolute; inset: 0; overflow: hidden; }
    .chanm-stage video, .chanm-stage iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; border: none; background: #000;
    }
    .chanm-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .chanm-stage img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; filter: grayscale(0.3) sepia(0.15) contrast(1.05);
      animation: kenburns 24s ease-in-out infinite alternate;
    }
    @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(1.5%, -1%); } }

    .chanm-place {
      position: absolute; top: 2rem; left: 2.2rem; z-index: 3; pointer-events: none;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.6rem;
      letter-spacing: 0.35em; text-transform: uppercase; color: rgba(240,236,228,0.5);
    }
    .chanm-title {
      position: absolute; bottom: 2.4rem; left: 2.2rem; right: 2.2rem; z-index: 3; pointer-events: none;
    }
    .chanm-title .t { font-style: italic; font-size: clamp(1.3rem, 3vw, 2rem); text-shadow: 0 0 18px rgba(0,0,0,0.9); }
    .chanm-title .y {
      font-family: 'Space Grotesk', sans-serif; font-size: 0.6rem;
      letter-spacing: 0.3em; color: var(--light-grey); margin-top: 0.4rem;
    }

    .chanm-teks {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 8vw;
    }
    .chanm-teks .kreyol {
      font-style: italic; font-size: clamp(1.6rem, 4vw, 3rem); line-height: 1.4; max-width: 24ch;
    }
    .chanm-teks .kreyol .w { display: inline-block; opacity: 0; transform: translateY(0.3em); }
    .chanm-teks .kreyol .w.in { opacity: 1; transform: none; transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1); }
    .chanm-teks .echo {
      margin-top: 2rem; font-family: 'Space Grotesk', sans-serif;
      font-size: 0.85rem; color: var(--light-grey); line-height: 1.9; max-width: 60ch;
      opacity: 0; transition: opacity 1.4s ease 0.8s;
    }
    .chanm-teks .echo.in { opacity: 1; }

    .chanm-souvni {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 8vw;
    }
    .chanm-souvni .memory {
      font-style: italic; font-size: clamp(1.2rem, 2.6vw, 1.8rem); color: var(--warm);
      max-width: 40ch; line-height: 1.6;
      border-left: 2px solid rgba(217,160,102,0.4); padding-left: 1.4rem; text-align: left;
    }
    .chanm-souvni .count {
      margin-top: 2.2rem; font-family: 'Space Grotesk', sans-serif;
      font-size: 0.66rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--grey);
    }
    .leave-btn {
      background: none; border: 1px solid rgba(217,160,102,0.4);
      color: var(--warm); font-family: 'Space Grotesk', sans-serif;
      font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.85rem 1.5rem; cursor: pointer; margin-top: 2rem;
      transition: border-color 0.3s ease, color 0.3s ease;
    }
    .leave-btn:hover { border-color: var(--warm); color: var(--bone); }

    .chanm-next {
      position: absolute; bottom: 2.4rem; right: 2.2rem; z-index: 3; pointer-events: none;
      font-family: 'Space Grotesk', sans-serif; font-size: 0.58rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: rgba(240,236,228,0.35);
    }
    .chanm-close {
      position: absolute; top: 1.8rem; right: 2rem; z-index: 4;
      background: none; border: none; cursor: pointer;
      color: var(--light-grey); font-family: 'Space Grotesk', sans-serif;
      font-size: 0.66rem; letter-spacing: 0.25em; text-transform: uppercase;
      padding: 0.5rem; transition: color 0.3s ease;
    }
    .chanm-close:hover { color: var(--bone); }

    #burn {
      position: fixed; inset: 0; z-index: 89; pointer-events: none;
      opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(240,220,180,0.95), rgba(196,64,47,0.6) 30%, transparent 65%);
    }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      .grain, .grann-presence, .mic.listening, .chanm-stage img { animation: none !important; }
    }
  </style>
</head>
<body>
  <video id="grainVid" muted loop playsinline></video>
  <div class="grain"></div>

  <!-- SYÈL LA (always underneath) -->
  <canvas id="sky"></canvas>
  <div id="label"><span id="labelText"></span><span class="kind" id="labelKind"></span></div>
  <p class="sky-hint" id="skyHint">trennen pou w vire syèl la &middot; klike sou yon zetwal &middot; pwoche — tande</p>
  <button class="mute" id="muteBtn" aria-label="Sound on/off">son: on</button>

  <!-- PÒTAY -->
  <div class="portal" id="portal">
    <div id="knockZone">
      <form class="knock-form" id="knockForm">
        <label for="knock" class="sr-only">You are at a threshold. Speak or type your greeting.</label>
        <input class="knock-input" id="knock" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="mic" id="mic" aria-label="Speak instead of typing" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
          </svg>
        </button>
      </form>
      <p class="whisper" id="whisper" aria-live="polite"></p>
    </div>
    <div class="grann-zone" id="grannZone" aria-live="polite">
      <button class="grann-btn" id="grannBtn" aria-label="Grann">
        <div class="grann-presence" id="grannFace"></div>
        <span class="grann-name">Grann</span>
      </button>
      <div id="counsel"></div>
      <form class="knock-form" id="knockForm2" style="margin-top:1.6rem; display:none;">
        <label for="knock2" class="sr-only">Try your greeting again</label>
        <input class="knock-input" id="knock2" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
    </div>
  </div>

  <div class="respe-flash" id="respeFlash" aria-live="assertive"><div class="respe-word">RESPÈ</div></div>

  <!-- VEIL + CHANM + BURN -->
  <canvas id="veil"></canvas>
  <div class="chanm" id="chanm" role="dialog" aria-modal="true">
    <div class="chanm-stage" id="chanmStage"></div>
    <span class="chanm-place" id="chanmPlace"></span>
    <button class="chanm-close" id="chanmClose">tounen</button>
    <span class="chanm-next" id="chanmNext">klike — next</span>
  </div>
  <div id="burn"></div>

  <script src="data/places.js"></script>
  <script>
  // ===================================================================
  // GRENN PWOMENNEN — one portal, one sky. Everything emanates from it.
  // ===================================================================
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ----------------------------------------------------------------
  // SOUND ENGINE — one AudioContext; « Onè » is the unlocking gesture
  // ----------------------------------------------------------------
  const Snd = {
    ctx: null, master: null, duck: null, muted: false,
    bed: null, hums: [], projector: null,

    init() {
      if (this.ctx) return;
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.duck = this.ctx.createGain();
        this.duck.connect(this.master);
        this.master.connect(this.ctx.destination);
        this.master.gain.value = 0.9;
        document.getElementById('muteBtn').classList.add('on');
        this.startBed();
      } catch (e) {}
    },

    toggleMute() {
      if (!this.ctx) return;
      this.muted = !this.muted;
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.9, this.ctx.currentTime, 0.1);
      document.getElementById('muteBtn').textContent = 'son: ' + (this.muted ? 'off' : 'on');
    },

    // night bed: real recording if provided, synthesized lakou-night until then
    startBed() {
      const el = new Audio('assets/portal/ambians.mp3');
      el.loop = true;
      el.addEventListener('canplaythrough', () => {
        const src = this.ctx.createMediaElementSource(el);
        const g = this.ctx.createGain(); g.gain.value = 0.5;
        src.connect(g); g.connect(this.duck);
        el.play().catch(() => {});
        this.bed = { gain: g };
      }, { once: true });
      el.addEventListener('error', () => this.synthBed(), { once: true });
      el.load();
    },
    synthBed() {
      const c = this.ctx;
      const g = this.ctx.createGain(); g.gain.value = 0.16; g.connect(this.duck);
      // low earth drone
      [55, 82.5].forEach(f => {
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const og = c.createGain(); og.gain.value = f === 55 ? 0.5 : 0.18;
        o.connect(og); og.connect(g); o.start();
      });
      // night air: filtered noise, slow breathing
      const noise = this.noiseSource();
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3800; bp.Q.value = 2.2;
      const ng = c.createGain(); ng.gain.value = 0.05;
      const lfo = c.createOscillator(); lfo.frequency.value = 0.11;
      const lg = c.createGain(); lg.gain.value = 0.03;
      lfo.connect(lg); lg.connect(ng.gain); lfo.start();
      noise.connect(bp); bp.connect(ng); ng.connect(g);
      this.bed = { gain: g };
    },
    noiseSource() {
      const c = this.ctx, len = c.sampleRate * 2;
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true; src.start();
      return src;
    },

    // the drum that answers RESPÈ — real tanbou if provided
    drum() {
      if (!this.ctx) return;
      const el = new Audio('assets/portal/tanbou.mp3');
      el.addEventListener('canplaythrough', () => {
        const src = this.ctx.createMediaElementSource(el);
        src.connect(this.duck); el.play().catch(() => {});
      }, { once: true });
      el.addEventListener('error', () => {
        [0, 0.5].forEach(dt => this.drumHit(this.ctx.currentTime + dt));
      }, { once: true });
      el.load();
    },
    drumHit(t) {
      const c = this.ctx;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.25);
      const g = c.createGain();
      g.gain.setValueAtTime(0.9, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      o.connect(g); g.connect(this.duck);
      o.start(t); o.stop(t + 0.7);
    },

    // star whisper hums, distance-driven
    addHum(freq) {
      if (!this.ctx) return null;
      const c = this.ctx;
      const g = c.createGain(); g.gain.value = 0; g.connect(this.duck);
      [freq, freq * 1.5 + 1.7].forEach((f, i) => {
        const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const og = c.createGain(); og.gain.value = i ? 0.35 : 1;
        o.connect(og); og.connect(g); o.start();
      });
      this.hums.push(g);
      return g;
    },
    setDuck(v) {
      if (this.ctx) this.duck.gain.setTargetAtTime(v, this.ctx.currentTime, 0.4);
    },

    // 16mm projector hum for leader placeholders
    startProjector() {
      if (!this.ctx || this.projector) return;
      const c = this.ctx;
      const g = c.createGain(); g.gain.value = 0.12; g.connect(this.master);
      const noise = this.noiseSource();
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
      const flutter = c.createGain(); flutter.gain.value = 1;
      const lfo = c.createOscillator(); lfo.frequency.value = 24;
      const lg = c.createGain(); lg.gain.value = 0.35;
      lfo.connect(lg); lg.connect(flutter.gain); lfo.start();
      noise.connect(lp); lp.connect(flutter); flutter.connect(g);
      this.projector = g;
    },
    stopProjector() {
      if (this.projector) {
        this.projector.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
        const p = this.projector; this.projector = null;
        setTimeout(() => p.disconnect(), 800);
      }
    },
  };
  document.getElementById('muteBtn').addEventListener('click', () => Snd.toggleMute());

  // ----------------------------------------------------------------
  // PÒTAY — the ritual
  // ----------------------------------------------------------------
  function normalize(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z]/g, ''); }
  function isOne(s) { const n = normalize(s); return n === 'one' || /^h?on+e+$/.test(n); }

  const portal = document.getElementById('portal');
  let entered = false, grannShown = false;

  // first keystroke = the hand on the door = audio unlock
  document.getElementById('knock').addEventListener('input', () => Snd.init(), { once: true });
  document.getElementById('knock').addEventListener('focus', () => {}, { once: true });

  const whisperTimer = setTimeout(() => {
    const w = document.getElementById('whisper');
    w.innerHTML = 'ou rive devan yon kay… &middot; you have arrived at a door… &middot; te voil&agrave; devant une porte…';
    w.classList.add('visible');
  }, 7000);
  const grannTimer = setTimeout(() => { if (!grannShown && !entered) showGrann('silence'); }, 20000);

  // Grann: photograph if provided, presence-glow until then
  (function grannPhoto() {
    const img = new Image();
    img.onload = () => {

  const COUNSEL = {

  document.getElementById('knockForm').addEventListener('submit', e => { e.preventDefault(); attempt(document.getElementById('knock').value); });
  document.getElementById('knockForm2').addEventListener('submit', e => { e.preventDefault(); attempt(document.getElementById('knock2').value); });

  const SRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  // material grain: use the real 16mm scan the moment it exists
  (function realGrain() {

  // ----------------------------------------------------------------
  // SYÈL LA — the sky
  // ----------------------------------------------------------------
  let skyBooted = false, nodes = [], camApi = null;

  function bootSky() {
    if (skyBooted) return;
    skyBooted = true;
    (function loadThree(i) {
      const urls = [
        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
        'https://unpkg.com/three@0.128.0/build/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
      ];
      if (i >= urls.length) return;
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = () => buildSky();
      s.onerror = () => loadThree(i + 1);
      document.head.appendChild(s);
    })(0);
  }

  function buildSky() {
    const PAP = { lat: 18.5944, lon: -72.3074 };
    const COLORS = { core: '#f0ece4', kominote: '#d9a066', travay: '#c4402f', toude: '#e0b184', sous: '#b9c4d6', zanset: '#e8c9a0' };

    const R_EARTH = 6371, toRad = d => d * Math.PI / 180;
    function distBearing(lat1, lon1, lat2, lon2) {
      const p1 = toRad(lat1), p2 = toRad(lat2), dl = toRad(lon2 - lon1);
      const d = Math.acos(Math.min(1, Math.sin(p1) * Math.sin(p2) + Math.cos(p1) * Math.cos(p2) * Math.cos(dl))) * R_EARTH;
      const y = Math.sin(dl) * Math.cos(p2);
      const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
      return { d, brg: Math.atan2(y, x) };
    }
    const INNER_KM = 300, INNER_R = 165, OUTER_R = 700, MAX_KM = 8200;
    const projR = d => d <= INNER_KM ? d * (INNER_R / INNER_KM)
      : INNER_R + (d - INNER_KM) * ((OUTER_R - INNER_R) / (MAX_KM - INNER_KM));

    const canvas = document.getElementById('sky');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x040404, 0.00045);
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 1, 8000);

    function glowTexture(hex, soft) {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const x = c.getContext('2d');
      const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
      if (soft) { g.addColorStop(0, hex + '55'); g.addColorStop(0.5, hex + '22'); g.addColorStop(1, hex + '00'); }
      else { g.addColorStop(0, hex); g.addColorStop(0.25, hex + 'cc'); g.addColorStop(0.6, hex + '33'); g.addColorStop(1, hex + '00'); }
      x.fillStyle = g; x.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }

    // nebula
    const nebTex = [glowTexture('#d9a066', true), glowTexture('#c4402f', true), glowTexture('#6a6f8a', true)];
    const nebulae = [];
    for (let i = 0; i < 14; i++) {
      const m = new THREE.SpriteMaterial({ map: nebTex[i % 3], transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.5 });
      const s = new THREE.Sprite(m);
      const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 620;
      s.position.set(Math.cos(a) * r, (Math.random() - 0.5) * 120 - 60, Math.sin(a) * r);
      s.scale.setScalar(360 + Math.random() * 520);
      s.userData.rot = (Math.random() - 0.5) * 0.0004;
      scene.add(s); nebulae.push(s);
    }

    // rings
    [150, 300, 1000, 2500, 5000, 7500].forEach(km => {
      const r = projR(km), pts = [];
      for (let i = 0; i <= 128; i++) {
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
      }
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0xf0ece4, transparent: true, opacity: 0.05 })));
    });

    // nodes from the manifest
    function place(data, type, size) {
      data.type = type;
      const { d, brg } = distBearing(PAP.lat, PAP.lon, data.lat, data.lon);
      data.dist = Math.round(d);
      const r = projR(d);
      const mat = new THREE.SpriteMaterial({ map: glowTexture(COLORS[type]), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
      const s = new THREE.Sprite(mat);
      s.position.set(Math.sin(brg) * r, (Math.random() - 0.5) * (type === 'sous' || type === 'zanset' ? 10 : 26), -Math.cos(brg) * r);
      s.scale.setScalar(size);
      s.userData = data;
      data.sprite = s; data.baseSize = size; data.phase = Math.random() * Math.PI * 2;
      scene.add(s); nodes.push(data);
      if (data.tone) data.hum = Snd.addHum(data.tone);
    }

    const core = GP.core;
    core.type = 'core'; core.dist = 0;
    {
      const mat = new THREE.SpriteMaterial({ map: glowTexture(COLORS.core), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
      const s = new THREE.Sprite(mat);
      s.position.set(0, 0, 0); s.scale.setScalar(34); s.userData = core;
      core.sprite = s; core.baseSize = 34; core.phase = 0;
      scene.add(s); nodes.push(core);
      if (core.tone) core.hum = Snd.addHum(core.tone);
    }
    GP.sous.forEach(p => { p.kind = 'sous — the wellspring'; place(p, 'sous', p.size); });
    GP.zanset.forEach(p => { p.kind = 'zansèt — ancestor'; place(p, 'zanset', p.size); });
    GP.places.forEach(p => {
      p.kind = p.type === 'kominote' ? 'kominote — community' : p.type === 'travay' ? 'travay — the work' : 'kominote + travay';
      place(p, p.type, p.size);
    });

    // filaments
    const filaments = [];
    nodes.forEach(n => {
      if (n.type === 'core') return;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(new Array(25 * 3).fill(0), 3));
      const line = new THREE.Line(g, new THREE.LineBasicMaterial({
        color: new THREE.Color(COLORS[n.type] || '#d9a066'), transparent: true,
        opacity: n.type === 'kominote' ? 0.22 : n.type === 'sous' ? 0.16 : n.type === 'zanset' ? 0.12 : 0.34,
        blending: THREE.AdditiveBlending,
      }));
      scene.add(line);
      filaments.push({ node: n, line });
    });
    function updateFilaments() {
      const a = new THREE.Vector3(0, 0, 0);
      filaments.forEach(f => {
        const b = f.node.sprite.position;
        const mid = a.clone().add(b).multiplyScalar(0.5);
        mid.y += b.distanceTo(a) * 0.16;
        const attr = f.line.geometry.attributes.position;
        for (let i = 0; i <= 24; i++) {
          const t = i / 24;
          const p = new THREE.Vector3()
            .addScaledVector(a, (1 - t) * (1 - t))
            .addScaledVector(mid, 2 * (1 - t) * t)
            .addScaledVector(b, t * t);
          attr.setXYZ(i, p.x, p.y, p.z);
        }
        attr.needsUpdate = true;
      });
    }

    // dust
    {
      const N = 3000, pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        const r = 900 + Math.random() * 3000, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(p) * Math.cos(t);
        pos[i * 3 + 1] = r * Math.cos(p);
        pos[i * 3 + 2] = r * Math.sin(p) * Math.sin(t);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8a8a8a, size: 1.3, transparent: true, opacity: 0.3 })));
    }

    // camera — falls in from far when the door opens
    let theta = -0.4, phi = 0.95, radius = 2600;
    let tTheta = theta, tPhi = phi, tRadius = 1150;
    const lookAt = new THREE.Vector3(0, 0, 0), tLookAt = new THREE.Vector3(0, 0, 0);
    let interacted = false;

    camApi = {
      flyTo(n) { tLookAt.copy(n.sprite.position); tRadius = 240; },
      home() { tLookAt.set(0, 0, 0); tRadius = 1150; },
    };

    let dragging = false, moved = 0, last = null, pinchDist = null;
    const pxy = e => e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };

    canvas.addEventListener('mousedown', e => { dragging = true; moved = 0; last = pxy(e); canvas.classList.add('dragging'); });
    addEventListener('mousemove', e => {
      if (dragging) {
        const p = pxy(e);
        tTheta += (p.x - last.x) * 0.005;
        tPhi = Math.min(1.45, Math.max(0.25, tPhi - (p.y - last.y) * 0.004));
        moved += Math.abs(p.x - last.x) + Math.abs(p.y - last.y);
        last = p; interacted = true;
      } else if (!chanmOpen) onHover(e);
    });
    addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('dragging'); });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      tRadius = Math.min(2600, Math.max(180, tRadius + e.deltaY * 0.8));
      interacted = true;
    }, { passive: false });
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      } else { dragging = true; moved = 0; last = pxy(e); }
      interacted = true;
    }, { passive: true });
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinchDist) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        tRadius = Math.min(2600, Math.max(180, tRadius * pinchDist / d));
        pinchDist = d;
      } else if (dragging) {
        const p = pxy(e);
        tTheta += (p.x - last.x) * 0.006;
        tPhi = Math.min(1.45, Math.max(0.25, tPhi - (p.y - last.y) * 0.005));
        moved += Math.abs(p.x - last.x) + Math.abs(p.y - last.y);
        last = p;
      }
    }, { passive: true });
    canvas.addEventListener('touchend', () => {
      if (dragging && moved < 8 && last) tryPick(last.x, last.y);
      dragging = false; pinchDist = null;
    });
    canvas.addEventListener('click', e => { if (moved <= 8) tryPick(e.clientX, e.clientY); });

    const ray = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const label = document.getElementById('label');
    let hovered = null;

    function pick(x, y) {
      mouse.x = (x / innerWidth) * 2 - 1;
      mouse.y = -(y / innerHeight) * 2 + 1;
      ray.setFromCamera(mouse, camera);
      const hits = ray.intersectObjects(nodes.map(n => n.sprite));
      return hits.length ? hits[0].object.userData : null;
    }
    function onHover(e) {
      const n = pick(e.clientX, e.clientY);
      hovered = n;
      if (n) {
        document.getElementById('labelText').textContent = n.name;
        document.getElementById('labelKind').textContent = (n.kind || '') + (n.dist ? ' · ' + n.dist.toLocaleString() + ' km' : '');
        label.style.left = e.clientX + 'px';
        label.style.top = e.clientY + 'px';
        label.classList.add('visible');
        canvas.style.cursor = 'pointer';
      } else {
        label.classList.remove('visible');
        canvas.style.cursor = dragging ? 'grabbing' : 'grab';
      }
    }
    function tryPick(x, y) {
      if (chanmOpen) return;
      const n = pick(x, y);
      if (n) openChanm(n);
    }

    // loop
    let t = 0;
    (function frame() {
      t += 0.016;
      if (!interacted && !reduced && !chanmOpen) tTheta += 0.0005;
      theta += (tTheta - theta) * 0.05;
      phi += (tPhi - phi) * 0.05;
      radius += (tRadius - radius) * 0.045;
      lookAt.lerp(tLookAt, 0.05);
      camera.position.set(
        lookAt.x + radius * Math.sin(phi) * Math.cos(theta),
        lookAt.y + radius * Math.cos(phi),
        lookAt.z + radius * Math.sin(phi) * Math.sin(theta)
      );
      camera.lookAt(lookAt);
      nodes.forEach(n => {
        const pulse = 1 + Math.sin(t * 1.1 + n.phase) * (n.type === 'core' ? 0.1 : 0.07);
        n.sprite.scale.setScalar(n.baseSize * pulse * (hovered === n ? 1.5 : 1));
        // proximity whisper
        if (n.hum && Snd.ctx) {
          const d = camera.position.distanceTo(n.sprite.position);
          const g = Math.max(0, 1 - d / 900) * 0.035;
          n.hum.gain.setTargetAtTime(chanmOpen ? 0 : g, Snd.ctx.currentTime, 0.3);
        }
      });
      updateFilaments();
      nebulae.forEach(s => { s.material.rotation += s.userData.rot; });
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    })();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    canvas.classList.add('on');
  }

  // ----------------------------------------------------------------
  // CHANM — the possession sequence
  // ----------------------------------------------------------------
  let chanmOpen = false, currentPlace = null, fragIndex = 0, activeMedia = [];
  const chanmEl = document.getElementById('chanm');
  const stage = document.getElementById('chanmStage');
  const visited = new Set();

  window.openChanmById = function (id) {
    const all = [GP.core, ...GP.sous, ...GP.zanset, ...GP.places];
    const p = all.find(x => x.id === id);
    if (p) openChanm(p);
  };

  function fragmentsOf(place) {
    const frags = (place.fragments || []).slice();
    // aleatory: dreams don't repeat in the same order
    if (visited.has(place.id) && frags.length > 1) {
      for (let i = frags.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [frags[i], frags[j]] = [frags[j], frags[i]];
      }
    }
    // every chamber ends with the memories and the offering
    frags.push({ type: 'souvni', place });
    return frags;
  }

  function openChanm(place) {
    if (chanmOpen) return;
    chanmOpen = true;
    currentPlace = place;
    fragIndex = 0;
    if (camApi && place.sprite) camApi.flyTo(place);
    Snd.setDuck(0.12);
    setTimeout(() => {
      tearVeil(() => {
        chanmEl.classList.add('visible');
        place._frags = fragmentsOf(place);
        visited.add(place.id);
        document.getElementById('chanmPlace').textContent =
          place.name + (place.dist ? ' · ' + place.dist.toLocaleString() + ' km soti Pòtoprens' : '');
        showFragment();
      });
    }, 900);
  }

  function closeChanm() {
    if (!chanmOpen) return;
    clearStage();
    Snd.stopProjector();
    // boule — the film burns in the gate
    const burn = document.getElementById('burn');
    burn.style.transition = 'none'; burn.style.opacity = '0';
    requestAnimationFrame(() => {
      burn.style.transition = 'opacity 0.28s ease';
      burn.style.opacity = '1';
      setTimeout(() => {
        chanmEl.classList.remove('visible');
        burn.style.transition = 'opacity 0.9s ease';
        burn.style.opacity = '0';
        chanmOpen = false;
        Snd.setDuck(0.35);
        if (camApi) camApi.home();
      }, 300);
    });
  }
  document.getElementById('chanmClose').addEventListener('click', e => { e.stopPropagation(); closeChanm(); });
  addEventListener('keydown', e => {
    if (!chanmOpen) return;
    if (e.key === 'Escape') closeChanm();
    if (e.key === 'ArrowRight' || e.key === ' ') nextFragment();
  });
  chanmEl.addEventListener('click', e => {
    if (e.target.closest('.leave-btn') || e.target.closest('.chanm-close')) return;
    nextFragment();
  });

  function nextFragment() {
    fragIndex++;
    if (fragIndex >= currentPlace._frags.length) closeChanm();
    else showFragment();
  }

  function clearStage() {
    activeMedia.forEach(m => { try { m.pause && m.pause(); m._stop && m._stop(); } catch (e) {} });
    activeMedia = [];
    Snd.stopProjector();
    stage.innerHTML = '';
    document.querySelector('.chanm-title')?.remove();
  }

  function titleBlock(t, y) {
    const d = document.createElement('div');
    d.className = 'chanm-title';
    d.innerHTML = `<div class="t">${t}</div>` + (y ? `<div class="y">${y}</div>` : '');
    chanmEl.appendChild(d);
  }

  function showFragment() {
    clearStage();
    const f = currentPlace._frags[fragIndex];
    document.getElementById('chanmNext').textContent =
      fragIndex < currentPlace._frags.length - 1 ? 'klike — next' : 'klike — tounen nan syèl la';

    if (f.type === 'fim') renderFim(f);
    else if (f.type === 'vwa') renderVwa(f);
    else if (f.type === 'teks') renderTeks(f);
    else if (f.type === 'imaj') renderImaj(f);
    else if (f.type === 'zanset') renderZanset(f);
    else if (f.type === 'souvni') renderSouvni(f);
  }

  // ---- fim: real file > vimeo > 16mm leader placeholder ----
  function renderFim(f) {
    titleBlock(f.title, f.year);
    if (f.vimeo) {
      const ifr = document.createElement('iframe');
      ifr.src = `https://player.vimeo.com/video/${f.vimeo}?autoplay=1&title=0&byline=0&portrait=0`;
      ifr.allow = 'autoplay; fullscreen';
      stage.appendChild(ifr);
      return;
    }
    const v = document.createElement('video');
    v.autoplay = true; v.playsInline = true; v.controls = false;
    v.addEventListener('error', () => { v.remove(); renderLeader(f); }, { once: true });
    v.addEventListener('ended', () => nextFragment(), { once: true });
    v.src = f.src || 'about:invalid';
    stage.appendChild(v);
    activeMedia.push(v);
  }

  // the leader: what a star projects while it waits for its reel
  function renderLeader(f) {
    const c = document.createElement('canvas');
    stage.appendChild(c);
    const x = c.getContext('2d');
    let run = true, t0 = performance.now();
    function size() { c.width = stage.clientWidth; c.height = stage.clientHeight; }
    size();
    Snd.startProjector();
    (function draw(now) {
      if (!run || !c.isConnected) { run = false; return; }
      const t = (now - t0) / 1000;
      const W = c.width, H = c.height;
      // base flicker
      const fl = 0.88 + Math.random() * 0.12;
      x.fillStyle = `rgb(${14 * fl | 0},${11 * fl | 0},${9 * fl | 0})`;
      x.fillRect(0, 0, W, H);
      // gate weave
      const wx = Math.sin(t * 7.3) * 3 + (Math.random() - 0.5) * 2;
      x.save(); x.translate(wx, 0);
      // countdown circle (8..1, looping)
      const n = 8 - Math.floor(t % 8);
      const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.27;
      x.strokeStyle = 'rgba(240,236,228,0.5)'; x.lineWidth = 2;
      x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.stroke();
      x.beginPath(); x.arc(cx, cy, R * 0.985, -Math.PI / 2, -Math.PI / 2 + ((t % 1) * Math.PI * 2));
      x.strokeStyle = 'rgba(240,236,228,0.25)'; x.lineWidth = R * 0.03 + 1; x.stroke();
      x.fillStyle = 'rgba(240,236,228,0.75)';
      x.font = `${R * 1.1 | 0}px 'EB Garamond', serif`;
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(n, cx, cy + R * 0.05);
      // crosshair
      x.strokeStyle = 'rgba(240,236,228,0.18)'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(cx - R * 1.6, cy); x.lineTo(cx + R * 1.6, cy);
      x.moveTo(cx, cy - R * 1.6); x.lineTo(cx, cy + R * 1.6); x.stroke();
      // scratches
      for (let i = 0; i < 3; i++) {
        if (Math.random() < 0.35) {
          const sx = Math.random() * W;
          x.strokeStyle = `rgba(240,236,228,${0.05 + Math.random() * 0.12})`;
          x.lineWidth = Math.random() < 0.1 ? 2 : 1;
          x.beginPath(); x.moveTo(sx, 0); x.lineTo(sx + (Math.random() - 0.5) * 8, H); x.stroke();
        }
      }
      // dust
      for (let i = 0; i < 14; i++) {
        x.fillStyle = `rgba(240,236,228,${Math.random() * 0.25})`;
        x.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
      }
      // occasional frame slip
      if (Math.random() < 0.02) { x.drawImage(c, 0, H * 0.4, W, H * 0.6, 0, H * 0.45, W, H * 0.6); }
      x.restore();
      // caption
      x.fillStyle = 'rgba(138,138,138,0.8)';
      x.font = `500 ${Math.max(10, W * 0.009) | 0}px 'Space Grotesk', sans-serif`;
      x.textAlign = 'left';
      x.fillText(('AP TANN BOBIN NAN — AWAITING THE REEL').split('').join(String.fromCharCode(8202)), 24, H - 70);
      requestAnimationFrame(draw);
    })(t0);
    activeMedia.push({ _stop: () => { run = false; } });
  }

  // ---- vwa: real audio (amplitude-driven visual) or synthesized signal ----
  function renderVwa(f) {
    titleBlock(f.label || 'vwa');
    const c = document.createElement('canvas');
    stage.appendChild(c);
    const x = c.getContext('2d');
    c.width = stage.clientWidth; c.height = stage.clientHeight;
    let analyser = null, synth = false, run = true;

    if (f.src && Snd.ctx) {
      const el = new Audio(f.src);
      el.addEventListener('canplaythrough', () => {
        const srcNode = Snd.ctx.createMediaElementSource(el);
        analyser = Snd.ctx.createAnalyser(); analyser.fftSize = 256;
        srcNode.connect(analyser); analyser.connect(Snd.master);
        el.play().catch(() => {});
        el.addEventListener('ended', () => nextFragment(), { once: true });
      }, { once: true });
      el.addEventListener('error', () => { synth = true; }, { once: true });
      el.load();
      activeMedia.push(el);
    } else synth = true;

    const data = new Uint8Array(128);
    let t = 0;
    (function draw() {
      if (!run || !c.isConnected) { run = false; return; }
      t += 0.016;
      const W = c.width, H = c.height;
      x.fillStyle = 'rgba(6,5,5,0.28)'; x.fillRect(0, 0, W, H);
      let amp;
      if (analyser) { analyser.getByteFrequencyData(data); amp = data.reduce((a, b) => a + b, 0) / data.length / 255; }
      else amp = 0.25 + Math.abs(Math.sin(t * 0.8)) * 0.3 + Math.random() * 0.06;
      // horizontal signal scratches — the voice as worn optical track
      const rows = 22;
      for (let i = 0; i < rows; i++) {
        const y = H * (0.5 + (i - rows / 2) * 0.018);
        const a = Math.max(0, amp - Math.abs(i - rows / 2) / rows) * 0.9;
        if (a <= 0.02) continue;
        x.strokeStyle = i % 5 === 0 ? `rgba(217,160,102,${a})` : `rgba(240,236,228,${a * 0.6})`;
        x.lineWidth = 1;
        x.beginPath();
        for (let px = 0; px < W; px += 7) {
          const jitter = (Math.random() - 0.5) * amp * 26;
          px === 0 ? x.moveTo(px, y + jitter) : x.lineTo(px, y + jitter);
        }
        x.stroke();
      }
      requestAnimationFrame(draw);
    })();
    activeMedia.push({ _stop: () => { run = false; } });
  }

  // ---- teks: lines tear in, Kreyòl first ----
  function renderTeks(f) {
    const d = document.createElement('div');
    d.className = 'chanm-teks';
    const words = f.kreyol.split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' ');
    d.innerHTML = `<p class="kreyol">${words}</p><p class="echo">${f.echo || ''}</p>`;
    stage.appendChild(d);
    const ws = d.querySelectorAll('.w');
    ws.forEach((w, i) => setTimeout(() => w.classList.add('in'), 200 + i * 110 + Math.random() * 90));
    setTimeout(() => d.querySelector('.echo').classList.add('in'), 200 + ws.length * 110);
  }

  // ---- imaj ----
  function renderImaj(f) {
    const img = document.createElement('img');
    img.src = f.src; img.alt = f.caption || '';
    img.addEventListener('error', () => { img.remove(); renderTeks({ kreyol: f.caption || '…', echo: '' }); }, { once: true });
    stage.appendChild(img);
    if (f.caption) titleBlock(f.caption);
  }

  // ---- zanset: presence + their words (voice when it exists) ----
  function renderZanset(f) {
    const d = document.createElement('div');
    d.className = 'chanm-teks';
    d.innerHTML =
      `<div class="grann-presence" style="margin-bottom:2.4rem"></div>` +
      `<p class="kreyol" style="font-size:clamp(1.2rem,2.6vw,1.8rem); max-width:44ch">${f.body}</p>`;
    stage.appendChild(d);
    titleBlock(f.name, 'zansèt — yon lòt pyebwa, another tree');
    if (f.src && Snd.ctx) {
      const el = new Audio(f.src);
      el.addEventListener('canplaythrough', () => el.play().catch(() => {}), { once: true });
      el.load();
      activeMedia.push(el);
    }
  }

  // ---- souvni: what was left here + the offering ----
  function renderSouvni(f) {
    const p = f.place;
    const d = document.createElement('div');
    d.className = 'chanm-souvni';
    d.innerHTML =
      (p.souvni ? `<p class="memory">${p.souvni}</p>` : `<p class="memory" style="color:var(--light-grey)">pa gen souvni isit la poko — no memories here yet</p>`) +
      `<p class="count">✶ ${p.istwa || 0} istwa kite isit — memories left here</p>` +
      `<button class="leave-btn">Kite yon souvni — leave a memory</button>`;
    d.querySelector('.leave-btn').addEventListener('click', e => {
      e.stopPropagation();
      e.target.textContent = '— the reciprocal ritual opens here in the production build —';
    });
    stage.appendChild(d);
  }

  // ---- the veil: seize the real frame and tear it ----
  function tearVeil(done) {
    const skyCanvas = document.getElementById('sky');
    const veil = document.getElementById('veil');
    const x = veil.getContext('2d');
    veil.width = innerWidth; veil.height = innerHeight;
    veil.style.display = 'block';
    let start = null;
    const DUR = reduced ? 120 : 680;
    function draw(now) {
      if (!start) start = now;
      const p = Math.min(1, (now - start) / DUR);
      const W = veil.width, H = veil.height;
      x.clearRect(0, 0, W, H);
      const slices = 26;
      for (let i = 0; i < slices; i++) {
        const sy = (H / slices) * i;
        const off = (Math.random() - 0.5) * 2 * p * p * W * 0.22;
        try { x.drawImage(skyCanvas, 0, sy, W, H / slices, off, sy, W, H / slices); } catch (e) {}
      }
      // rgb ghost
      if (!reduced && Math.random() < 0.7) {
        x.globalCompositeOperation = 'lighter';
        x.globalAlpha = 0.08 * p;
        try { x.drawImage(skyCanvas, 6 * p, 0); } catch (e) {}
        x.globalAlpha = 1;
        x.globalCompositeOperation = 'source-over';
      }
      // collapsing dark
      x.fillStyle = `rgba(4,3,3,${p * 0.9})`;
      x.fillRect(0, 0, W, H);
      if (p < 1) requestAnimationFrame(draw);
      else { veil.style.display = 'none'; done(); }
    }
    requestAnimationFrame(draw);
  }
  </script>
</body>
</html>
