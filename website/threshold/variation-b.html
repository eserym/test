<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threshold B — La Dérive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

    :root {
      --ink: #0a0a0a;
      --bone: #f0ece4;
      --choublak: #c4402f;
      --grey: #4a4a4a;
      --light-grey: #8a8a8a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ink);
      color: var(--bone);
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* mood canvas sits behind everything */
    #mood { position: fixed; inset: 0; z-index: 0; }

    .grain {
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      pointer-events: none; z-index: 50; opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.6s steps(6) infinite;
    }
    @keyframes grain {
      0%,100% { transform: translate(0,0); } 20% { transform: translate(-4%,-8%); }
      40% { transform: translate(4%,-4%); } 60% { transform: translate(-4%,6%); } 80% { transform: translate(6%,2%); }
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.8rem 2.2rem; mix-blend-mode: difference;
    }
    .site-name { font-family: 'EB Garamond', serif; font-size: 1.05rem; letter-spacing: 0.08em; }
    .lang-switch { display: flex; gap: 0.4rem; }
    .lang-switch button {
      background: none; border: none; color: var(--light-grey);
      font-family: 'Space Grotesk', sans-serif; font-size: 0.65rem;
      text-transform: uppercase; letter-spacing: 0.18em;
      padding: 0.35rem 0.5rem; cursor: pointer; transition: color 0.3s;
    }
    .lang-switch button.active { color: var(--bone); text-decoration: underline; text-underline-offset: 4px; }
    .lang-switch button:hover { color: var(--bone); }

    /* ===== BIG NAME BEHIND ===== */
    .backdrop-name {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1; pointer-events: none; text-align: center;
      font-family: 'EB Garamond', serif; font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 11rem); line-height: 0.95;
      color: rgba(240,236,228,0.07); letter-spacing: -0.02em;
      white-space: nowrap;
    }

    /* ===== DRIFTING DOOR CARDS ===== */
    .field { position: fixed; inset: 0; z-index: 10; }

    .card {
      position: absolute; cursor: pointer;
      width: clamp(200px, 24vw, 320px); padding: 1.8rem;
      background: rgba(10,10,10,0.55);
      border: 1px solid rgba(240,236,228,0.12);
      backdrop-filter: blur(4px);
      transition: border-color 0.5s ease, background 0.5s ease, transform 0.4s ease;
      will-change: transform;
    }
    .card:hover {
      border-color: rgba(240,236,228,0.4);
      background: rgba(10,10,10,0.75);
      z-index: 20;
    }
    .card-index { font-size: 0.6rem; color: var(--grey); letter-spacing: 0.3em; display: block; margin-bottom: 0.8rem; }
    .card-title {
      font-family: 'EB Garamond', serif; font-weight: 400;
      font-size: clamp(1.7rem, 3.2vw, 2.6rem); line-height: 1;
    }
    .card-sub {
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.26em;
      color: var(--light-grey); margin-top: 0.8rem;
    }
    .card-line { width: 2rem; height: 1px; background: var(--choublak); margin-top: 1.1rem; transition: width 0.5s ease; }
    .card:hover .card-line { width: 4.5rem; }

    /* drift animations — each card its own orbit */
    @keyframes driftA { 0%,100% { transform: translate(0,0) rotate(-0.6deg); } 33% { transform: translate(14px,-18px) rotate(0.4deg); } 66% { transform: translate(-10px,10px) rotate(-0.2deg); } }
    @keyframes driftB { 0%,100% { transform: translate(0,0) rotate(0.5deg); } 40% { transform: translate(-16px,12px) rotate(-0.5deg); } 75% { transform: translate(10px,-14px) rotate(0.3deg); } }
    @keyframes driftC { 0%,100% { transform: translate(0,0) rotate(0.2deg); } 30% { transform: translate(12px,16px) rotate(-0.4deg); } 70% { transform: translate(-14px,-8px) rotate(0.6deg); } }
    .card[data-door="watch"]  { top: 16vh; left: 10vw;  animation: driftA 14s ease-in-out infinite; }
    .card[data-door="listen"] { top: 30vh; right: 12vw; animation: driftB 17s ease-in-out infinite; }
    .card[data-door="read"]   { bottom: 18vh; left: 30vw; animation: driftC 15s ease-in-out infinite; }
    .card:hover { animation-play-state: paused; }

    /* ===== DERIVE ===== */
    .derive {
      position: fixed; bottom: 2rem; right: 2.2rem; z-index: 40;
      cursor: pointer; display: flex; align-items: center; gap: 0.7rem;
    }
    .derive-label {
      font-family: 'EB Garamond', serif; font-style: italic;
      font-size: 0.95rem; color: var(--light-grey); transition: color 0.4s ease;
    }
    .derive:hover .derive-label { color: var(--bone); }
    .derive-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--choublak);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }

    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .field { position: relative; padding: 8rem 1.5rem 6rem; display: flex; flex-direction: column; gap: 1.2rem; }
      .card { position: relative !important; top: auto !important; left: auto !important; right: auto !important; bottom: auto !important; width: 100%; animation: none; }
      .backdrop-name { font-size: 3rem; white-space: normal; }
    }

    @media (prefers-reduced-motion: reduce) {
      .grain, .card, .derive-dot { animation: none !important; }
      .card { transition-duration: 0.01s; }
    }
  </style>
</head>
<body>
  <canvas id="mood"></canvas>
  <div class="grain"></div>

  <header>
    <div class="site-name">Ésery Mondésir</div>
    <nav class="lang-switch" id="langSwitch" aria-label="Language">
      <button data-lang="en" class="active">EN</button>
      <button data-lang="fr">FR</button>
      <button data-lang="ht">KREYÒL</button>
    </nav>
  </header>

  <div class="backdrop-name">Ésery<br>Mondésir</div>

  <main class="field">
    <div class="card" data-door="watch" data-mood="16,18,34" role="link" tabindex="0">
      <span class="card-index">001</span>
      <h2 class="card-title" data-i18n="watch">Watch</h2>
      <p class="card-sub" data-i18n="watchSub">Films &amp; video works</p>
      <div class="card-line"></div>
    </div>
    <div class="card" data-door="listen" data-mood="38,24,14" role="link" tabindex="0">
      <span class="card-index">002</span>
      <h2 class="card-title" data-i18n="listen">Listen</h2>
      <p class="card-sub" data-i18n="listenSub">Voice &amp; sound</p>
      <div class="card-line"></div>
    </div>
    <div class="card" data-door="read" data-mood="14,32,24" role="link" tabindex="0">
      <span class="card-index">003</span>
      <h2 class="card-title" data-i18n="read">Read</h2>
      <p class="card-sub" data-i18n="readSub">Writing &amp; research</p>
      <div class="card-line"></div>
    </div>
  </main>

  <div class="derive" role="link" tabindex="0">
    <span class="derive-label" data-i18n="drift">or let the site drift you</span>
    <span class="derive-dot"></span>
  </div>

  <script>
    // ===== i18n =====
    const I18N = {
      en: { watch: 'Watch', listen: 'Listen', read: 'Read',
            watchSub: 'Films & video works', listenSub: 'Voice & sound', readSub: 'Writing & research',
            drift: 'or let the site drift you' },
      fr: { watch: 'Regarder', listen: 'Écouter', read: 'Lire',
            watchSub: 'Films & œuvres vidéo', listenSub: 'Voix & son', readSub: 'Écriture & recherche',
            drift: 'ou laissez le site vous porter' },
      ht: { watch: 'Gade', listen: 'Koute', read: 'Li',
            watchSub: 'Fim & videyo', listenSub: 'Vwa & son', readSub: 'Ekriti & rechèch',
            drift: 'oswa kite sit la mennen w' }
    };
    function setLang(lang) {
      const dict = I18N[lang] || I18N.en;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        if (dict[el.dataset.i18n]) el.textContent = dict[el.dataset.i18n];
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('#langSwitch button').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === lang));
      try { localStorage.setItem('em-lang', lang); } catch (e) {}
    }
    document.querySelectorAll('#langSwitch button').forEach(btn =>
      btn.addEventListener('click', () => setLang(btn.dataset.lang)));
    try { const saved = localStorage.getItem('em-lang'); if (saved) setLang(saved); } catch (e) {}

    // ===== mood canvas: slow drifting blobs; hovering a door tints the whole room =====
    const canvas = document.getElementById('mood');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
    resize(); addEventListener('resize', resize);

    // target mood color (rgb), eased toward on hover
    let mood = [10, 10, 12], target = [10, 10, 12];
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mouseenter', () => { target = card.dataset.mood.split(',').map(Number); });
      card.addEventListener('mouseleave', () => { target = [10, 10, 12]; });
    });

    const blobs = Array.from({ length: 5 }, (_, i) => ({
      x: Math.random(), y: Math.random(),
      r: 0.25 + Math.random() * 0.3,
      dx: (Math.random() - 0.5) * 0.0004,
      dy: (Math.random() - 0.5) * 0.0004,
      warm: i % 2 === 0
    }));

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function frame() {
      for (let i = 0; i < 3; i++) mood[i] += (target[i] - mood[i]) * 0.03;
      ctx.fillStyle = `rgb(${mood[0]|0},${mood[1]|0},${mood[2]|0})`;
      ctx.fillRect(0, 0, W, H);

      blobs.forEach(b => {
        if (!reduced) {
          b.x += b.dx; b.y += b.dy;
          if (b.x < -0.2 || b.x > 1.2) b.dx *= -1;
          if (b.y < -0.2 || b.y > 1.2) b.dy *= -1;
        }
        const g = ctx.createRadialGradient(b.x * W, b.y * H, 0, b.x * W, b.y * H, b.r * Math.max(W, H));
        const tint = b.warm
          ? `rgba(${Math.min(mood[0] + 26, 60)},${mood[1]|0},${mood[2]|0},0.35)`
          : `rgba(${mood[0]|0},${mood[1]|0},${Math.min(mood[2] + 22, 55)},0.3)`;
        g.addColorStop(0, tint);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      });

      requestAnimationFrame(frame);
    }
    frame();

    // click feedback
    document.querySelectorAll('.card, .derive').forEach(el => {
      el.addEventListener('click', () => {
        el.style.outline = '1px solid rgba(196,64,47,0.6)';
        setTimeout(() => { el.style.outline = ''; }, 350);
      });
      el.addEventListener('keydown', e => { if (e.key === 'Enter') el.click(); });
    });
  </script>
</body>
</html>
